<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="nova-token" content="__NOVA_TOKEN__">
  <meta name="color-scheme" content="light dark">
  <title>Nova</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6l7 37 37 7-37 7-7 37-7-37-37-7 37-7z' fill='%234F8EF7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="nova-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="4" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="app" id="app">
    <aside class="side glass" id="side" aria-label="Main menu">
      <div class="brand">
        <svg viewBox="0 0 100 100" class="logo" aria-hidden="true"><path d="M50 6l7 37 37 7-37 7-7 37-7-37-37-7 37-7z"/><circle cx="50" cy="50" r="9" fill="#fff"/></svg>
        <div><strong>Nova</strong><small>Study planner &amp; AI tutor</small></div>
      </div>
      <nav class="nav" id="nav" aria-label="Screens"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar glass lens">
        <button class="btn icon-btn" id="menu" aria-label="Hide or show the menu" aria-expanded="true" aria-controls="side" title="Hide or show the menu (Ctrl+B)">
          <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <h1 id="title">Nova</h1>
        <span class="spacer"></span>
        <span class="ai-dot" id="ai-dot" title=""></span>
        <button class="btn icon-btn btn-sm" id="theme-toggle" aria-label="Switch light and dark" title="Switch light and dark"></button>
        <button class="btn icon-btn btn-sm avatar-btn" id="avatar-btn" aria-label="Account" title="Account"></button>
      </header>
      <main class="stage"><section class="view scroll" id="view" tabindex="-1"></section></main>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="/js/core.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
